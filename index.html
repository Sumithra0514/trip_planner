
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <h1>✈️ AI Trip Planner</h1>

    <p>Where would you like to travel?</p>

    <textarea id="query"
        placeholder="Plan a 3-day trip to Tokyo with hotels and food suggestions..."></textarea>

    <button onclick="planTrip()">Plan My Trip</button>

    <div id="result">Your travel plan will appear here.</div>

    <script>
        async function planTrip() {
            const query = document.getElementById("query").value;
            const result = document.getElementById("result");

            if (!query.trim()) {
                result.textContent = "Please enter your travel request.";
                return;
            }

            result.textContent = "Planning your trip...";

            try {
                const response = await fetch("/plan-trip", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ query: query })
});
                

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request failed");
                }

                result.textContent = data.answer;
            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
